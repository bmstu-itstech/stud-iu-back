name: stud-iu

services:
  backend:
    container_name: stud-iu-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: production_build
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --access-logfile - --error-logfile -"
    environment:
      DOMAIN_NAME: localhost
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-secret-key}
      POSTGRES_DB: ${POSTGRES_DB:-stud_db}
      POSTGRES_USER: ${POSTGRES_USER:-stud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stud_pass}
      DJANGO_DATABASE_HOST: db
      DJANGO_DATABASE_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static

  db:
    image: postgres:18-alpine
    container_name: stud-iu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stud_db}
      POSTGRES_USER: ${POSTGRES_USER:-stud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stud_pass}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stud_user} -d ${POSTGRES_DB:-stud_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
  media_volume:
  static_volume:
